name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - desktop.py
      - ciphers.py
      - rsa_lab.py
      - .github/workflows/windows.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.12.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PugCrypt desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: PugCrypt-Windows-x64
          path: dist/PugCrypt.exe
          if-no-files-found: error
